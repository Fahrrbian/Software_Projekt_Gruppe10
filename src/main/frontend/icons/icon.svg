<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
    <title id="title">App Test Icon</title>
    <!-- Monitor Frame -->
    <rect x="6" y="8" width="52" height="36" rx="3" ry="3"
          fill="none"
          stroke="currentColor"
          stroke-width="2"/>
    <!-- Monitor Stand -->
    <rect x="28" y="46" width="8" height="4"
          fill="currentColor"/>

    <!-- Checklist Items -->
    <g fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round">
        <!-- Item 1 -->
        <rect x="12" y="14" width="6" height="6" rx="1" ry="1"/>
        <polyline points="14,17 17,20 20,14"/>
        <line x1="22" y1="18" x2="42" y2="18"/>

        <!-- Item 2 -->
        <rect x="12" y="26" width="6" height="6" rx="1" ry="1"/>
        <polyline points="14,29 17,32 20,26"/>
        <line x1="22" y1="30" x2="42" y2="30"/>

        <!-- Item 3 -->
        <rect x="12" y="36" width="6" height="6" rx="1" ry="1"/>
        <polyline points="14, 41, 17,44 20,38"/>
        <line x1="22" y1="40" x2="42" y2="40"/>
    </g>

</svg>
